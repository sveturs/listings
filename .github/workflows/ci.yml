name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.25'
  GOPRIVATE: github.com/vondi-global/*

# Prevent parallel runs on same branch - cancel previous run
concurrency:
  group: ci-listings-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate go.mod
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Check no replace directives in go.mod
        run: |
          if grep -q "^replace" go.mod; then
            echo "❌ ERROR: go.mod contains replace directives!"
            echo ""
            echo "Found replace directives:"
            grep "^replace" go.mod
            echo ""
            echo "Replace directives are for local development only."
            echo "Remove them before committing to main/develop."
            exit 1
          else
            echo "✅ No replace directives found in go.mod"
          fi

  lint:
    name: Lint
    runs-on: self-hosted
    needs: [validate]
    env:
      # Fix "permission denied" on self-hosted runners where /tmp has noexec
      # /tmp is noexec for security (prevent crypto miners/viruses)
      TMPDIR: ${{ github.workspace }}/.gotmp
      GOTMPDIR: ${{ github.workspace }}/.gotmp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Create temp directory for Go builds
        run: mkdir -p ${{ github.workspace }}/.gotmp

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        env:
          GOPRIVATE: github.com/vondi-global/*
        run: |
          go mod download
          go mod tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --timeout=5m
        env:
          GOPRIVATE: github.com/vondi-global/*

  test:
    name: Test
    runs-on: self-hosted
    needs: [validate]
    env:
      # Fix "permission denied" on self-hosted runners where /tmp has noexec
      # /tmp is noexec for security (prevent crypto miners/viruses)
      TMPDIR: ${{ github.workspace }}/.gotmp
      GOTMPDIR: ${{ github.workspace }}/.gotmp
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: listings_db_test
          POSTGRES_USER: listings_user
          POSTGRES_PASSWORD: listings_password
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Create temp directory for tests
        run: mkdir -p ${{ github.workspace }}/.gotmp

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        env:
          VONDILISTINGS_DB_HOST: localhost
          VONDILISTINGS_DB_PORT: 15432
          VONDILISTINGS_DB_USER: listings_user
          VONDILISTINGS_DB_PASSWORD: listings_password
          VONDILISTINGS_DB_NAME: listings_db_test
          VONDILISTINGS_REDIS_HOST: localhost
          VONDILISTINGS_REDIS_PORT: 16379
        run: go test -v -race -short ./internal/... ./test/...

  build:
    name: Build
    runs-on: self-hosted
    needs: [validate, lint, test]
    env:
      # Fix "permission denied" on self-hosted runners where /tmp has noexec
      # /tmp is noexec for security (prevent crypto miners/viruses)
      TMPDIR: ${{ github.workspace }}/.gotmp
      GOTMPDIR: ${{ github.workspace }}/.gotmp
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Create temp directory for Go builds
        run: mkdir -p ${{ github.workspace }}/.gotmp

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build application
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: listings-service
          path: bin/listings-service
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: self-hosted
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: listings-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Tests
    runs-on: self-hosted
    needs: [build]
    if: github.event_name == 'pull_request'
    env:
      # Fix "permission denied" on self-hosted runners where /tmp has noexec
      # /tmp is noexec for security (prevent crypto miners/viruses)
      TMPDIR: ${{ github.workspace }}/.gotmp
      GOTMPDIR: ${{ github.workspace }}/.gotmp
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: listings_db_test
          POSTGRES_USER: listings_user
          POSTGRES_PASSWORD: listings_password
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GO_MODULES_TOKEN }}

      - name: Create temp directory for tests
        run: mkdir -p ${{ github.workspace }}/.gotmp

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Configure git for private modules
        run: git config --global url."https://${{ secrets.GO_MODULES_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Run integration tests
        env:
          VONDILISTINGS_DB_HOST: localhost
          VONDILISTINGS_DB_PORT: 15432
          VONDILISTINGS_DB_USER: listings_user
          VONDILISTINGS_DB_PASSWORD: listings_password
          VONDILISTINGS_DB_NAME: listings_db_test
          VONDILISTINGS_REDIS_HOST: localhost
          VONDILISTINGS_REDIS_PORT: 16379
        run: go test -v -tags=integration ./internal/... ./test/...
